
name: Flask Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # STEP 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # STEP 2: Build Docker image
      - name: Build Docker image
        run: docker build -t devsecops-flask-lab:ci .

      # STEP 3: Investigate setuptools discrepancy
      - name: Investigate setuptools scan discrepancy
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -i \
            --entrypoint python \
            devsecops-flask-lab:ci - <<'PY'
          import importlib.metadata as md
          import json
          from pathlib import Path

          print("Installed setuptools:", md.version("setuptools"))
          print("Installed pip:", md.version("pip"))

          path = Path(
              md.distribution("pip").locate_file(
                  "pip/_vendor/bom.cdx.json"
              )
          )

          print("Bundled pip SBOM exists:", path.exists())

          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              versions = [
                  component.get("version")
                  for component in data.get("components", [])
                  if component.get("name", "").lower() == "setuptools"
              ]
              print("Setuptools versions in bundled pip SBOM:", versions)
          else:
              print("No bundled pip SBOM at:", path)
          PY

      # STEP 4: Test Flask application and non-root execution
      - name: Test live app and non-root execution
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name devsecops-ci \
            -p 127.0.0.1:5000:5000 \
            devsecops-flask-lab:ci

          trap 'docker rm -f devsecops-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/health 2>/dev/null | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:5000/health | grep -q '"status":"ok"'

          curl -fsS http://127.0.0.1:5000/ | grep -q '"status":"running"'

          test "$(docker exec devsecops-ci id -un)" = "appuser"

          echo "PASS: health endpoint, homepage, non-root user"

      # STEP 5: Install verified Trivy binary
      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.76.2"
          ARCHIVE="$RUNNER_TEMP/trivy_${VERSION}_Linux-64bit.tar.gz"

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --output "$ARCHIVE" \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"

          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $ARCHIVE" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/trivy-bin"

          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/trivy-bin" trivy

          "$RUNNER_TEMP/trivy-bin/trivy" --version

      # STEP 6: Scan Docker image and report findings
      - name: Scan Docker image with Trivy (report only)
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/trivy-bin/trivy" image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --format table \
            --exit-code 0 \
            devsecops-flask-lab:ci

      # STEP 7: Enforce HIGH and CRITICAL security gate
      - name: Enforce security gate (HIGH and CRITICAL)
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/trivy-bin/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            devsecops-flask-lab:ci
